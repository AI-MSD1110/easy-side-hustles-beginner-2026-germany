name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'   # Runs daily at 01:30 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.'
          close-issue-message: 'This issue was automatically closed because it has been stale for too long.'
          close-pr-message: 'This PR was automatically closed because it has been stale for too long.'
          days-before-stale: 30
          days-before-close: 14
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security'
